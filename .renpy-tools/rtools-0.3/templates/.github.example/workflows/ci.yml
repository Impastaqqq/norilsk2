name: Ren'Py CI Pipeline

on:
  push:
    branches: 
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    env:
      # Ren'Py SDK Engine Version used for automated builds and testing
      RENPY_VERSION: "8.5.3"
      RENPY_SDK: "${{ github.workspace }}/renpy-sdk"

      # --- Headless Rendering & Audio Configuration Flags ---
      # Forces Mesa to use CPU-based software OpenGL rendering (llvmpipe) since CI runners lack physical GPUs
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Redirects SDL audio output to a dummy driver to prevent engine audio crash on headless Linux
      SDL_AUDIODRIVER: "dummy"
      # Suppresses Ren'Py internal sound engine errors when no sound card is present
      RENPY_SOUND: "dummy"

    steps:
      # 1. Check out repository code WITHOUT downloading large Git LFS binary files (keeps CI fast)
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false

      # 2. Set up Python 3.12 (Matching Ren'Py 8.x internal Python 3 runtime environment)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Cache the downloaded Ren'Py SDK folder between CI runs
      - name: Cache Ren'Py SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: ${{ env.RENPY_SDK }}
          key: renpy-sdk-${{ env.RENPY_VERSION }}

      # 4. Download and unpack official Ren'Py SDK bz2 archive if not already cached
      - name: Download Ren'Py SDK
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          wget -q https://www.renpy.org/dl/${{ env.RENPY_VERSION }}/renpy-${{ env.RENPY_VERSION }}-sdk.tar.bz2
          tar -xjf renpy-${{ env.RENPY_VERSION }}-sdk.tar.bz2
          mv renpy-${{ env.RENPY_VERSION }}-sdk ${{ env.RENPY_SDK }}
          rm renpy-${{ env.RENPY_VERSION }}-sdk.tar.bz2

      # 5. Install Linux system packages required to run Ren'Py in a headless environment without a physical screen or GPU
      # Packages installed:
      # - xvfb: X Virtual Framebuffer creates a virtual display server in memory so Ren'Py can render screens and handle UI clicks without a monitor.
      # - libegl1 & libgl1: Core OpenGL and EGL graphics API interfaces required by Pygame/Ren'Py.
      # - libgl1-mesa-dri & libglx-mesa0: Mesa DRI software rasterizers (swrast/llvmpipe) that render OpenGL graphics on the CPU when no hardware GPU is present.
      # - mesa-utils: Provides utilities for managing software GL rendering contexts and GLX extensions (+extension GLX +render).
      # - libsdl2-2.0-0: Simple DirectMedia Layer library handling window creation, event queues, and audio driver initializations for Ren'Py.
      - name: Install Graphic Dependencies (Xvfb & Mesa Software Rendering)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 mesa-utils libsdl2-2.0-0

      # 6. Verify environment configurations and binary paths
      - name: Run manage.py Verify
        run: python manage.py verify

      # 7. Run custom static analysis checkers
      - name: Run Ren'Py Static Checks
        run: python manage.py check

      # 8. Run Ren'Py built-in static analysis (lint) in virtual 1080p Xvfb display
      # Note: --server-args specifies explicit 1920x1080 resolution so spatial UI coordinates and screens are not clipped!
      - name: Run Ren'Py Lint
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 +extension GLX +render -noreset" python manage.py lint

      # 9. Run automated test suite in virtual 1080p Xvfb display
      - name: Run Automated Tests (Global Suite)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24 +extension GLX +render -noreset" python manage.py test global --timeout 60

      # 10. Publish execution status to GitHub Actions Step Summary UI
      - name: Publish Test Summary
        if: always()
        run: |
          echo "### 🧪 Ren'Py CI Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Executed" >> $GITHUB_STEP_SUMMARY
          echo "- **Engine Version:** ${{ env.RENPY_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner:** Ubuntu Latest (Headless Xvfb)" >> $GITHUB_STEP_SUMMARY

      # 11. Upload engine diagnostic logs (log.txt, traceback.txt, errors.txt) as build artifacts on failure
      - name: Upload Debug Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renpy-debug-logs
          path: |
            ${{ env.RENPY_SDK }}/log.txt
            ${{ github.workspace }}/log.txt
            ${{ github.workspace }}/traceback.txt
            ${{ github.workspace }}/errors.txt
          retention-days: 7
